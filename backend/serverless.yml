service: wp-campsite-backend

frameworkVersion: '4'

build:
  esbuild:
    bundle: true
    minify: false
    external:
      - '@aws-sdk/*'

provider:
  name: aws
  runtime: nodejs20.x
  region: ap-southeast-2   # Sydney，离墨尔本最近
  stage: ${opt:stage, 'dev'}
  environment:
    DYNAMODB_TABLE: ${self:service}-${self:provider.stage}
    SES_FROM_EMAIL: 'noreply@sheltoncui.com'
    CRON_SECRET: ${env:CRON_SECRET, ''}
  httpApi:
    cors:
      allowedOrigins:
        - https://d27uqj4rfn4tet.cloudfront.net
        - http://localhost:5173
        - http://localhost:5174
        - http://localhost:5175
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        issuerUrl: !GetAtt CognitoUserPool.ProviderURL
        audience:
          - !Ref CognitoUserPoolClient
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource:
            - !GetAtt CampsiteTable.Arn
            - !Join ['/', [!GetAtt CampsiteTable.Arn, 'index/*']]
        - Effect: Allow
          Action:
            - ses:SendEmail
            - ses:SendRawEmail
          Resource: '*'

functions:
  # 收藏 CRUD
  getFavourites:
    handler: src/functions/favourites.list
    events:
      - httpApi:
          path: /api/favourites
          method: get
          authorizer:
            name: cognitoAuthorizer

  createFavourite:
    handler: src/functions/favourites.create
    events:
      - httpApi:
          path: /api/favourites
          method: post
          authorizer:
            name: cognitoAuthorizer

  deleteFavourite:
    handler: src/functions/favourites.remove
    events:
      - httpApi:
          path: /api/favourites/{id}
          method: delete
          authorizer:
            name: cognitoAuthorizer

  markBooked:
    handler: src/functions/favourites.booked
    events:
      - httpApi:
          path: /api/favourites/{id}/booked
          method: put
          authorizer:
            name: cognitoAuthorizer

  unmarkBooked:
    handler: src/functions/favourites.unbook
    events:
      - httpApi:
          path: /api/favourites/{id}/unbook
          method: put
          authorizer:
            name: cognitoAuthorizer

  # 手动查询空位（公开，不需要登录）
  checkAvailability:
    handler: src/functions/check.handler
    events:
      - httpApi:
          path: /api/check
          method: post

  # 定时检查 + 发邮件通知（EventBridge 触发，不走 API Gateway）
  cronCheck:
    handler: src/functions/cron.handler
    timeout: 60
    events:
      - schedule:
          rate: rate(30 minutes)
          enabled: true

  # 用户设置
  getSettings:
    handler: src/functions/settings.get
    events:
      - httpApi:
          path: /api/settings
          method: get
          authorizer:
            name: cognitoAuthorizer

  updateSettings:
    handler: src/functions/settings.update
    events:
      - httpApi:
          path: /api/settings
          method: put
          authorizer:
            name: cognitoAuthorizer

resources:
  Resources:
    CampsiteTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.DYNAMODB_TABLE}
        BillingMode: PAY_PER_REQUEST   # 按需计费，免费额度内
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE

    # Cognito User Pool
    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-users-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: false
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            Required: true
            Mutable: true

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: ${self:service}-client-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
        PreventUserExistenceErrors: ENABLED

    # S3 桶托管前端
    FrontendBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-frontend-${self:provider.stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html

    FrontendBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref FrontendBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Join ['', [!GetAtt FrontendBucket.Arn, '/*']]
              Condition:
                StringEquals:
                  AWS:SourceArn: !Join ['', ['arn:aws:cloudfront::', !Ref 'AWS::AccountId', ':distribution/', !Ref FrontendDistribution]]

    # CloudFront 分发
    FrontendDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Enabled: true
          DefaultRootObject: index.html
          Origins:
            - Id: S3Origin
              DomainName: !GetAtt FrontendBucket.RegionalDomainName
              OriginAccessControlId: !Ref FrontendOAC
              S3OriginConfig:
                OriginAccessIdentity: ''
          DefaultCacheBehavior:
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
            Compress: true
          CustomErrorResponses:
            - ErrorCode: 403
              ResponseCode: 200
              ResponsePagePath: /index.html
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html

    FrontendOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: ${self:service}-oac-${self:provider.stage}
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

  Outputs:
    ApiUrl:
      Value: !GetAtt HttpApi.ApiEndpoint
      Description: API Gateway URL
    FrontendBucket:
      Value: !Ref FrontendBucket
      Description: S3 bucket for frontend
    CloudFrontUrl:
      Value: !GetAtt FrontendDistribution.DomainName
      Description: CloudFront distribution URL
    UserPoolId:
      Value: !Ref CognitoUserPool
      Description: Cognito User Pool ID
    UserPoolClientId:
      Value: !Ref CognitoUserPoolClient
      Description: Cognito User Pool Client ID
